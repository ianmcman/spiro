# Homelab Spirograph: the same page as the public site, with name and picture tracing and exports done on the server.
# LAN/VPN only: put it behind your reverse proxy on an internal hostname, never on the public internet.
services:
  spirograph-lab:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: spirograph-lab:local
    container_name: spirograph-lab
    ports:
      - "${LAB_PORT:-8099}:8080"
    restart: unless-stopped
    environment:
      # Optional: a push when a background render finishes (ntfy), and/or a JSON POST (Home Assistant webhook).
      PUBLIC_URL: ${LAB_PUBLIC_URL:-}
      NTFY_URL: ${LAB_NTFY_URL:-}
      NTFY_TOKEN: ${LAB_NTFY_TOKEN:-}
      HA_WEBHOOK_URL: ${LAB_HA_WEBHOOK_URL:-}
      # Pattern of the day by email: set DAILY_AT (HH:MM in TZ) plus an SMTP account.
      TZ: ${LAB_TZ:-UTC}
      DAILY_AT: ${LAB_DAILY_AT:-}
      SMTP_HOST: ${LAB_SMTP_HOST:-}
      SMTP_PORT: ${LAB_SMTP_PORT:-587}
      SMTP_USER: ${LAB_SMTP_USER:-}
      SMTP_PASS: ${LAB_SMTP_PASS:-}
      MAIL_FROM: ${LAB_MAIL_FROM:-}
      MAIL_TO: ${LAB_MAIL_TO:-}
    volumes:
      - ${LAB_DATA:-../data}:/data        # saved designs, pictures and finished renders; must be writable by uid 1000
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 6g
    cpus: 4
