services:
  spirograph:
    build: .
    image: spirograph:local
    container_name: spirograph
    ports:
      - "${SPIRO_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    # --- Traefik: serve on a hostname instead of a host port ---------------
    # 1. Remove the "ports:" block above.
    # 2. Uncomment the labels and networks below (set the host and entrypoint/resolver names to match your Traefik).
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=proxy
    #   - traefik.http.routers.spirograph.rule=Host(`spiro.example.com`)
    #   - traefik.http.routers.spirograph.entrypoints=websecure
    #   - traefik.http.routers.spirograph.tls=true
    #   - traefik.http.routers.spirograph.tls.certresolver=letsencrypt
    #   - traefik.http.services.spirograph.loadbalancer.server.port=8080
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
